name: Build demo APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: using the debug key, so builds cannot update each other."
          else
            # Tolerate stray spaces, line breaks and quotes from copy and paste.
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n"' | base64 -d > "$ks" 2>/dev/null || true
            if keytool -list -keystore "$ks" -storepass "$KEYSTORE_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "ANDROID_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
              echo "Signing key OK."
            else
              echo "::warning::The signing key secrets are set but not valid (check the copy and paste of ANDROID_KEYSTORE_BASE64, the password and the alias). Using the debug key."
            fi
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk elite-play-ludo-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: elite-play-ludo-demo
          path: elite-play-ludo-demo.apk
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --cleanup-tag --yes || true
          gh release create demo elite-play-ludo-demo.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Elite Play BD Ludo - demo APK" \
            --notes "build: ${{ github.run_number }}. Demo build. Install the APK below on Android; later builds can be installed from inside the app (Settings > Check for updates)."
