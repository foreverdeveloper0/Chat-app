name: Build demo APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set: using the debug key, so builds cannot update each other."
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk elite-play-ludo-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: elite-play-ludo-demo
          path: elite-play-ludo-demo.apk
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --cleanup-tag --yes || true
          gh release create demo elite-play-ludo-demo.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Elite Play BD Ludo - demo APK" \
            --notes "build: ${{ github.run_number }}. Demo build. Install the APK below on Android; later builds can be installed from inside the app (Settings > Check for updates)."
